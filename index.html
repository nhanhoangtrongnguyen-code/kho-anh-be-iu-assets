<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >


  <title>
    Kho Ảnh Xinh Của Em Bé Iu 📸💕
  </title>


  <!-- =====================================================
       ICON HOME SCREEN
  ====================================================== -->

  <link
    rel="apple-touch-icon"
    href="./icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="./icon.png"
  >


  <!-- =====================================================
       IOS HOME SCREEN APP MODE
  ====================================================== -->

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Kho Ảnh Bé Iu"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >


  <!-- =====================================================
       PREPARE GOOGLE CONNECTION

       Vẫn chuẩn bị kết nối sớm,
       nhưng cố ý giữ màn hình launcher 450 ms.
  ====================================================== -->

  <link
    rel="preconnect"
    href="https://script.google.com"
  >

  <link
    rel="dns-prefetch"
    href="//script.google.com"
  >

  <link
    rel="preconnect"
    href="https://script.googleusercontent.com"
  >


  <!-- =====================================================
       HOME SCREEN DETECTION + 450 MS DELAY
  ====================================================== -->

  <script>

    const APP_URL =
      "https://script.google.com/macros/s/AKfycbzc1h3USKNaFo_4TecPvlpvO9Qi-JQRBvs92CwEyeNhsDaryz5gvzlISn1tv2eTsxzS/exec";


    const isIOSStandalone =
      window.navigator.standalone === true;


    const isStandaloneDisplay =
      window.matchMedia &&
      window.matchMedia(
        "(display-mode: standalone)"
      ).matches;


    const isAppLaunch =
      isIOSStandalone ||
      isStandaloneDisplay;


    /*
      Nếu mở từ icon Home Screen:

      → hiện màn hình chờ xinh xinh
      → giữ 450 ms
      → chuyển sang Apps Script
    */

    if (isAppLaunch) {

      document.documentElement.classList.add(
        "app-launch"
      );


      setTimeout(
        function() {

          window.location.replace(
            APP_URL
          );

        },

        450
      );
    }

  </script>


  <style>

    * {
      box-sizing: border-box;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-tap-highlight-color:
        transparent;
    }


    html,
    body {
      margin: 0;
      min-height: 100%;
    }


    body {
      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        24px 18px;

      background:
        linear-gradient(
          135deg,
          #ffe6ea 0%,
          #ffe4e1 100%
        );
    }


    .card {
      width: 100%;
      max-width: 420px;

      padding:
        28px 22px;

      border-radius: 26px;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      text-align: center;

      box-shadow:
        0 12px 30px
        rgba(
          255,
          182,
          193,
          0.35
        );
    }


    .icon {
      display: block;

      width: 88px;
      height: 88px;

      margin:
        0 auto 16px;

      border-radius: 22px;
    }


    h1 {
      margin:
        0 0 12px;

      color:
        #ff4d79;

      font-size: 21px;

      line-height: 1.3;
    }


    p {
      margin: 0;

      color:
        #666;

      font-size: 14px;

      line-height: 1.6;
    }


    .hint {
      margin-top: 16px;

      padding:
        12px 14px;

      border-radius: 14px;

      background:
        #fff0f3;

      color:
        #d87093;

      font-size: 13px;

      line-height: 1.55;
    }


    .open-button {
      display: inline-block;

      width: 100%;

      margin-top: 18px;

      padding:
        14px 18px;

      border-radius: 28px;

      background:
        linear-gradient(
          135deg,
          #ff4d79,
          #ff1a53
        );

      color: white;

      font-size: 15px;
      font-weight: 700;

      text-decoration: none;

      box-shadow:
        0 6px 15px
        rgba(
          255,
          77,
          121,
          0.28
        );
    }


    /* =====================================================
       NORMAL SAFARI SCREEN

       Dùng để Add to Home Screen.
    ====================================================== */

    .install-screen {
      display: block;
    }


    /* =====================================================
       HOME SCREEN LAUNCH SCREEN

       Chỉ hiện trong 450 ms trước redirect.
    ====================================================== */

    .launch-screen {
      display: none;
    }


    html.app-launch .install-screen {
      display: none;
    }


    html.app-launch .launch-screen {
      display: block;
    }


    .launch-text {
      margin-top: 5px;

      color:
        #d87093;

      font-size: 15px;

      font-weight: 650;

      line-height: 1.6;
    }


    .tiny-heart {
      margin-top: 8px;

      font-size: 22px;
    }

  </style>

</head>


<body>


  <!-- =====================================================
       SAFARI NORMAL

       Trang này ở lại GitHub để Add to Home Screen.
  ====================================================== -->

  <div class="card install-screen">

    <img
      src="./icon.png"
      class="icon"
      alt="Kho Ảnh Bé Iu"
    >


    <h1>
      Kho Ảnh Xinh Của Em Bé Iu 📸💕
    </h1>


    <p>
      Bé thêm chỗ này vào màn hình chính nhaaa 💕
    </p>


    <div class="hint">

      Trên iPhone:

      <br>

      <b>
        Chia sẻ ↑ → Thêm vào Màn hình chính
      </b>

      <br><br>

      Sau đó bé chỉ cần bấm icon xinh xinh
      trên màn hình là được nèeee 🌸

    </div>


    <a
      class="open-button"
      href="https://script.google.com/macros/s/AKfycbzc1h3USKNaFo_4TecPvlpvO9Qi-JQRBvs92CwEyeNhsDaryz5gvzlISn1tv2eTsxzS/exec"
    >
      Mở Kho Ảnh 💕
    </a>

  </div>


  <!-- =====================================================
       HOME SCREEN

       Hiện khoảng 450 ms.
  ====================================================== -->

  <div class="card launch-screen">

    <img
      src="./icon.png"
      class="icon"
      alt="Kho Ảnh Bé Iu"
    >


    <h1>
      Kho Ảnh Xinh Của Em Bé Iu 📸💕
    </h1>


    <div class="launch-text">
      Anh đang mở kho ảnh cho bé nèeee 💕
    </div>


    <div class="tiny-heart">
      💗
    </div>

  </div>


</body>

</html>
