<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Kho Ảnh Xinh Của Em Bé Iu 📸💕</title>


  <!-- =====================================================
       ICON

       Đây là icon iPhone sẽ dùng khi Add to Home Screen.
  ====================================================== -->

  <link
    rel="apple-touch-icon"
    href="icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="icon.png"
  >


  <!-- =====================================================
       HOME SCREEN APP MODE
  ====================================================== -->

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Kho Ảnh Bé Iu"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >


  <!-- =====================================================
       REDIRECT

       QUAN TRỌNG:

       - Safari bình thường:
         KHÔNG redirect
         để mình Add to Home Screen với icon hồng.

       - Khi mở từ Home Screen:
         redirect NGAY sang Apps Script.
         Không setTimeout.
         Không delay 450 ms.
  ====================================================== -->

  <script>

    const APP_URL =
      "https://script.google.com/macros/s/AKfycbzc1h3USKNaFo_4TecPvlpvO9Qi-JQRBvs92CwEyeNhsDaryz5gvzlISn1tv2eTsxzS/exec";


    const isIOSStandalone =
      window.navigator.standalone === true;


    const isStandaloneDisplay =
      window.matchMedia &&
      window.matchMedia(
        "(display-mode: standalone)"
      ).matches;


    if (
      isIOSStandalone ||
      isStandaloneDisplay
    ) {

      /*
        Redirect ngay lập tức.

        KHÔNG:
        - setTimeout
        - màn hình chờ
        - delay 450 ms
      */

      window.location.replace(
        APP_URL
      );
    }

  </script>


  <style>

    * {
      box-sizing: border-box;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-tap-highlight-color:
        transparent;
    }


    html,
    body {
      margin: 0;
      min-height: 100%;
    }


    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        24px 18px;

      background:
        linear-gradient(
          135deg,
          #ffe6ea 0%,
          #ffe4e1 100%
        );
    }


    .card {
      width: 100%;
      max-width: 420px;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      padding:
        28px 22px;

      border-radius: 26px;

      text-align: center;

      box-shadow:
        0 12px 30px
        rgba(
          255,
          182,
          193,
          0.35
        );
    }


    .icon {
      width: 88px;
      height: 88px;

      border-radius: 22px;

      display: block;

      margin:
        0 auto 16px;
    }


    h1 {
      margin:
        0 0 12px;

      color:
        #ff4d79;

      font-size:
        21px;

      line-height:
        1.3;
    }


    p {
      margin:
        0;

      color:
        #666;

      font-size:
        14px;

      line-height:
        1.6;
    }


    .hint {
      margin-top:
        16px;

      padding:
        12px 14px;

      background:
        #fff0f3;

      border-radius:
        14px;

      color:
        #d87093;

      font-size:
        13px;

      line-height:
        1.55;
    }


    .open-button {
      display:
        inline-block;

      width:
        100%;

      margin-top:
        18px;

      padding:
        14px 18px;

      border:
        none;

      border-radius:
        28px;

      background:
        linear-gradient(
          135deg,
          #ff4d79,
          #ff1a53
        );

      color:
        white;

      font-size:
        15px;

      font-weight:
        700;

      text-decoration:
        none;

      cursor:
        pointer;

      box-shadow:
        0 6px 15px
        rgba(
          255,
          77,
          121,
          0.28
        );
    }

  </style>

</head>


<body>

  <!--
    Phần này chỉ hiện khi mở GitHub bằng Safari bình thường.

    Khi chạy từ Home Screen,
    redirect xảy ra ngay trong <head>
    nên gần như không nhìn thấy màn hình này.
  -->

  <div class="card">

    <img
      src="icon.png"
      class="icon"
      alt="Kho Ảnh Bé Iu"
    >


    <h1>
      Kho Ảnh Xinh Của Em Bé Iu 📸💕
    </h1>


    <p>
      Bé thêm chỗ này vào màn hình chính nhaaa 💕
    </p>


    <div class="hint">

      Trên iPhone:

      <br>

      <b>Chia sẻ ↑ → Thêm vào Màn hình chính</b>

      <br><br>

      Sau đó bé chỉ cần bấm icon xinh xinh trên màn hình là được nèeee 🌸

    </div>


    <a
      class="open-button"
      href="https://script.google.com/macros/s/AKfycbzc1h3USKNaFo_4TecPvlpvO9Qi-JQRBvs92CwEyeNhsDaryz5gvzlISn1tv2eTsxzS/exec"
    >
      Mở thử Kho Ảnh 💕
    </a>

  </div>

</body>

</html>
